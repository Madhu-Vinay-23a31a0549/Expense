<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Expense Tracker - Login</title>

  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-container">

    <div class="auth-card">

      <h1>Expense Tracker</h1>
      <p class="subtitle">Track your spending and manage your money smartly</p>

      <div class="tabs">
        <button class="tab-btn active" id="loginTab">Login</button>
        <button class="tab-btn" id="registerTab">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="Enter your email" required />
          <small class="error-message" id="loginEmailError"></small>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required />
          <small class="error-message" id="loginPasswordError"></small>
        </div>

        <div class="form-row">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" />
            Remember Me
          </label>

          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="primary-btn">Login</button>

      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form hidden">

        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input type="text" id="registerName" placeholder="Enter your full name" required />
          <small class="error-message" id="registerNameError"></small>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="Enter your email" required />
          <small class="error-message" id="registerEmailError"></small>
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" placeholder="Create password" required />
          <small class="error-message" id="registerPasswordError"></small>
        </div>

        <button type="submit" class="primary-btn">Register</button>

      </form>

    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
