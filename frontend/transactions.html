<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Transactions - Expense Tracker</title>

  <link rel="stylesheet" href="css/transactions.css" />
</head>
<body>

  <div class="transactions-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Expense Tracker</h2>

      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="transactions.html" class="active">Transactions</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <header class="page-header">
        <div>
          <h1>Transactions</h1>
          <p>Add, view, edit, delete, search, and filter your expenses.</p>
        </div>

        <button id="openAddModalBtn" class="primary-btn">+ Add Expense</button>
      </header>

      <!-- Search and Export -->
      <section class="toolbar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search by description..."
        />

        <button id="exportCsvBtn" class="secondary-btn">Export CSV</button>
      </section>

      <section class="content-grid">

        <!-- Filter Sidebar -->
        <aside class="filter-card">
          <h3>Filters</h3>

          <div class="form-group">
            <label for="filterCategory">Category</label>
            <select id="filterCategory">
              <option value="">All Categories</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Utilities">Utilities</option>
              <option value="Entertainment">Entertainment</option>
            </select>
          </div>

          <div class="form-group">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" />
          </div>

          <div class="form-group">
            <label for="endDate">End Date</label>
            <input type="date" id="endDate" />
          </div>

          <div class="form-group">
            <label for="minAmount">Minimum Amount</label>
            <input type="number" id="minAmount" placeholder="₹ Min" />
          </div>

          <div class="form-group">
            <label for="maxAmount">Maximum Amount</label>
            <input type="number" id="maxAmount" placeholder="₹ Max" />
          </div>

          <button id="applyFilterBtn" class="primary-btn">Apply Filter</button>
          <button id="clearFilterBtn" class="clear-btn">Clear Filter</button>
        </aside>

        <!-- Transactions Table -->
        <section class="table-card">

          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="transactionsTableBody">
              <tr>
                <td colspan="5">No expenses found</td>
              </tr>
            </tbody>
          </table>

        </section>

      </section>

    </main>
  </div>

  <!-- Add/Edit Expense Modal -->
  <div id="expenseModal" class="modal hidden">

    <div class="modal-content">

      <div class="modal-header">
        <h2 id="modalTitle">Add Expense</h2>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>

      <form id="expenseForm">

        <input type="hidden" id="expenseId" />

        <div class="form-group">
          <label for="expenseAmount">Amount</label>
          <input type="number" id="expenseAmount" placeholder="Enter amount" required />
          <small class="error-message" id="amountError"></small>
        </div>

        <div class="form-group">
          <label for="expenseCategory">Category</label>
          <select id="expenseCategory" required>
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
          </select>
          <small class="error-message" id="categoryError"></small>
        </div>

        <div class="form-group">
          <label for="expenseDate">Date</label>
          <input type="date" id="expenseDate" required />
          <small class="error-message" id="dateError"></small>
        </div>

        <div class="form-group">
          <label for="expenseDescription">Description</label>
          <textarea
            id="expenseDescription"
            placeholder="Optional description"
            maxlength="500"
          ></textarea>
          <small class="error-message" id="descriptionError"></small>
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="clear-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save Expense</button>
        </div>

      </form>

    </div>
  </div>

  <script src="js/transactions.js"></script>
</body>
</html>
